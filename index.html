<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flowchart Visualizer</title>
  <link rel="stylesheet" href="index.css">
</head>

<body>
  <div class="text-container">
    <textarea rows="50" cols="80" placeholder="Enter your code here..."></textarea>

    <div class="flowchart">
      <div class="branch">
        <div class="flowchart-item">calculate(x)</div>
      </div>
      
      <div class="branch">
        <div class="flowchart-item">x > 10 ?</div>
      </div>

      <div class="branch">
        <div class="flowchart-item">return x * 2</div>
        <div class="flowchart-item">return x + 2</div>
      </div>
    </div>
  </div>
  
  <button class="submit-btn">Submit</button>
  
</body>

<script src="parser.js"></script>

</html>
