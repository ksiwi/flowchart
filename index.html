<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flowchart Visualizer</title>
  <link rel="stylesheet" href="index.css">
  <script type="importmap">
    {
      "imports": {
        "mermaid": "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs",
        "@lezer/python": "https://esm.sh/@lezer/python@1.1.19"
      }
    }
  </script>
</head>
<body>
  <main class="text-container">
    <textarea
      id="userInputA"
      rows="50"
      cols="80"
      placeholder="Enter your code here..."
      aria-label="Enter Python code"
    ></textarea>

    <section class="flowchart" aria-label="Generated diagram">
      <div id="generated-flowchart"></div>
      <div id="display">Diagram appears here</div>

      <footer class="diagram-toolbar">
        <label for="diagram-mode">Mode</label>
        <select id="diagram-mode">
          <option value="functions">Functions</option>
          <option value="timeline">Timeline</option>
        </select>
        <div id="time-track">0</div>
      </footer>

    </section>
  </main>

  <script type="module" src="main.js"></script>
</body>
</html>
